[workspace]
resolver = "2"
members = ["api", "program"]

[workspace.package]
version = "1.1.1"
edition = "2021"
license = "Apache-2.0"
homepage = "https://minechain.gg"
documentation = "https://minechain.gg"
repository = "https://github.com/regolith-labs/ore"
readme = "./README.md"
keywords = ["solana", "crypto", "mining"]

[workspace.dependencies]
forge-api = { path = "./api", version = "1.1.1" }
const-crypto = "0.1.0"
bytemuck = "1.14"
mpl-core = { features = [], version ="0.11.1" }
num_enum = "0.7"
solana-program = "^2.1"
steel = { features = ["spl"], version = "4.0.3" }
spl-associated-token-account = { features = [ "no-entrypoint" ], version = "6.0" }
thiserror = "1.0.57"

